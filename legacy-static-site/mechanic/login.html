<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mechanic Login — BikerClinic</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF3D00;
      --bg: #12121A;
      --surface: #1A1A26;
      --border: #2A2A40;
      --text: #F8F8F8;
      --muted: #9E9EB5;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; display:flex; flex-direction:column; height:100vh; justify-content:center; align-items:center; padding:24px; }
    
    .login-card { background:var(--surface); border:1px solid var(--border); padding:32px; border-radius:16px; width:100%; max-width:400px; text-align:center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .logo { font-size:3rem; margin-bottom:12px; }
    h1 { font-size:1.4rem; margin-bottom:8px; }
    p { color:var(--muted); font-size:0.9rem; margin-bottom:24px; line-height:1.5; }
    
    .form-group { text-align:left; margin-bottom:16px; }
    label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:6px; font-weight:600; }
    .input-box { background:rgba(0,0,0,0.2); border:1px solid var(--border); padding:14px; border-radius:10px; color:#fff; width:100%; font-size:1rem; outline:none; transition: 0.2s; }
    .input-box:focus { border-color:var(--primary); }
    
    .btn { background:var(--primary); color:#fff; border:none; padding:16px; border-radius:10px; font-weight:700; font-size:1rem; width:100%; cursor:pointer; margin-top:8px; transition: 0.2s; }
    .btn:active { transform:scale(0.98); opacity:0.9; }
    .err-msg { color:#ef4444; font-size:0.85rem; margin-top:12px; display:none; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo">👨‍🔧</div>
    <h1>Mechanic Portal Sign In</h1>
    <p>Secure login for BikerClinic field technicians and mechanics.</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label>Technician ID / Name</label>
        <input type="text" id="techName" class="input-box" placeholder="e.g. Raju or T-102" required>
      </div>
      <div class="form-group">
        <label>Passcode</label>
        <input type="password" id="techPass" class="input-box" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">Access Terminal</button>
      <div id="errMsg" class="err-msg">Incorrect credentials. Hint: Any password works for demo.</div>
    </form>
  </div>

  <script>
    // If already logged in, redirect
    if (localStorage.getItem('bc_machanic_name')) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('techName').value.trim();
      const pass = document.getElementById('techPass').value.trim();
      
      // Simple mockup auth logic
      if(val && pass.length >= 3) {
        localStorage.setItem('bc_machanic_name', val);
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('errMsg').style.display = 'block';
      }
    });
  </script>
</body>
</html>
